services:

  database:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - 5432     # порты временно
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d booking_service"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
  redis:
    image: redis:alpine
    expose:
      - 6379  # порты временно
  
  celery_worker:
    build: .
    command: celery -A app.celery_app worker --pool=threads --loglevel=info
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  celery_beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  app:
    build: .
    expose:
      - 8000
    env_file: .env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - TZ=UTC
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: on-failure
  
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  
  ngrok: # ngrok only for development, VPN=USA, выключить is_yookassa_ip
    image: ngrok/ngrok:latest
    ports:
      - "4040:4040"
    command: http nginx:80
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - nginx

volumes:
  postgres_data: